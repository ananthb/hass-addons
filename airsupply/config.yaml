name: airsupply
version: "0.3.2"
slug: airsupply
description: Read a ResMed AirMini CPAP over Bluetooth Classic from a page in the sidebar. It writes nothing.
url: https://github.com/ananthb/airsupply
arch:
  - aarch64
  - amd64
init: false
startup: services
# Manual, not `auto`. The machine takes one Bluetooth connection at a time, so
# a running add-on is one the phone app cannot have; nothing should claim that
# on boot until this records something worth the trade.
boot: manual
# Everything happens on the page: finding the machine, pairing with it and
# reading. Options carry nothing the page cannot do better.
ingress: true
ingress_port: 8099
panel_icon: mdi:lungs
panel_title: airsupply
# What scyto/ha-bluetooth-audio-manager established is both necessary and
# sufficient for Bluetooth Classic from an add-on. `udev`, `devices` and
# `host_network` are deliberately absent: BlueZ is reached over D-Bus, never
# through /dev/hci*, so Home Assistant's own BLE scanning is left alone.
host_dbus: true
privileged:
  - NET_ADMIN
  - NET_RAW
apparmor: true
map:
  - type: data
    read_only: false
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
