name: Checks

# The Supervisor validates almost nothing before a user hits install: a
# missing option label renders as a bare key, and a Dockerfile naming an
# image tag that was never published fails on the user's device rather
# than here. Both are checked below.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  addons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - run: pip install pyyaml

      - name: Option translations cover every option
        run: python3 check-translations.py

      - name: Changelog leads with the add-on version
        run: |
          # Home Assistant shows CHANGELOG.md on the add-on page, so a
          # version bump that forgets it ships with the previous release's
          # notes on top. Where an add-on keeps a changelog, its first
          # entry must be the version config.yaml advertises.
          python3 - <<'PY'
          import pathlib, re, sys, yaml

          problems = []
          for changelog in sorted(pathlib.Path(".").glob("*/CHANGELOG.md")):
              version = str(yaml.safe_load((changelog.parent / "config.yaml").read_text())["version"])
              headings = re.findall(r"^## +(\S+)", changelog.read_text(), re.M)
              if not headings:
                  problems.append(f"{changelog}: no '## <version>' entry")
              elif headings[0] != version:
                  problems.append(f"{changelog}: newest entry is {headings[0]}, config.yaml says {version}")

          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      - name: Slug matches directory name
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml

          problems = []
          for config in sorted(pathlib.Path(".").glob("*/config.yaml")):
              addon = config.parent.name
              slug = yaml.safe_load(config.read_text()).get("slug")
              if slug != addon:
                  problems.append(f"{config}: slug {slug!r} does not match directory {addon!r}")

          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      - name: Every image an add-on builds on exists
        run: |
          set -euo pipefail

          # Resolved the way the Supervisor resolves them: read each
          # Dockerfile's FROM lines and expand them with build.yaml --
          # ${BUILD_FROM} to one ref per architecture, everything else
          # from `args`. Deriving the refs instead of listing them means
          # a new add-on, a new architecture or a new pinned ARG is
          # covered without touching this workflow.
          #
          # starla's pin is the one that has actually broken: its add-on
          # version and the upstream release it layers on move
          # independently, so a bump merged ahead of its release used to
          # fail on someone's Home Assistant box with "failed to resolve
          # source metadata" rather than here. That check lived in
          # ananthb/starla's ci.yml next to the build.yaml it read; the
          # build.yaml is here now, so the check is too.
          mapfile -t refs < <(python3 - <<'PY'
          import pathlib, re, yaml

          refs = set()

          for dockerfile in sorted(pathlib.Path(".").glob("*/Dockerfile")):
              build = yaml.safe_load((dockerfile.parent / "build.yaml").read_text())
              bases = list(build.get("build_from", {}).values())
              args = {k: str(v) for k, v in (build.get("args") or {}).items()}

              stages = set()
              for line in dockerfile.read_text().splitlines():
                  match = re.match(r"\s*FROM\s+(\S+)(?:\s+AS\s+(\S+))?\s*$", line, re.I)
                  if not match:
                      continue
                  ref, stage = match.group(1), match.group(2)
                  if stage:
                      stages.add(stage)

                  # A later FROM may name an earlier stage rather than a registry.
                  if ref in stages:
                      continue

                  if "${BUILD_FROM}" in ref:
                      refs |= {ref.replace("${BUILD_FROM}", base) for base in bases}
                      continue

                  for name, value in args.items():
                      ref = ref.replace("${" + name + "}", value)

                  if "$" in ref:
                      raise SystemExit(f"::error file={dockerfile}::unresolved variable in FROM {ref}")

                  refs.add(ref)

          print("\n".join(sorted(refs)))
          PY
          )

          failed=0
          for ref in "${refs[@]}"; do
            case "$ref" in
              ghcr.io/*) ;;
              *) echo "::error::$ref is not on ghcr.io; this check only knows that registry"; failed=1; continue ;;
            esac

            repo="${ref%:*}"; repo="${repo#ghcr.io/}"
            tag="${ref##*:}"

            token=$(curl -sSf "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r .token)
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${tag}")

            if [ "$code" = 200 ]; then
              echo "ok  $ref"
            else
              echo "::error::$ref is not published (HTTP $code); release it before pinning it"
              failed=1
            fi
          done

          exit "$failed"
